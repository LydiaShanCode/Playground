<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d1d1d1">
<title>Texture Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Sorts+Mill+Goudy:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,700&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, tactile, quiet
   IDEA a pocket digital camera that collects surfaces; the roll becomes folders and envelopes
   PICTURE the camera body itself (capture), then the texture roll as a carousel of objects
   COLOUR fog grey #d1d1d1 ground, champagne plastic body, charcoal LCD, sage tint chip
   TYPE Newsreader for names, Geist for meta, VT323 for LCD readouts
   LAYOUT one 402×891 phone screen, scaled to fit; wide screens keep big side margins */
:root{color-scheme:light;--fog:#d1d1d1;--ink:#111;--muted:#757575;--chip:rgba(128,128,128,.2);--glass:rgba(255,255,255,.2)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#c3c3c1;color:var(--ink);font:14px/1.4 Geist,ui-sans-serif,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid #2b5bd7;outline-offset:2px}
#frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#app{position:absolute;left:0;top:0;width:402px;height:891px;transform-origin:0 0;background:var(--fog);border-radius:32px;overflow:hidden;overflow:clip;box-shadow:0 30px 80px -30px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.04)}
.phone #app{border-radius:0;box-shadow:none}
.phone body,body.phone{background:var(--fog)}
.screen{position:absolute;inset:0;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.screen.off{opacity:0;pointer-events:none;transform:scale(.98)}
.ic{width:24px;height:24px;display:block;fill:none;stroke:#1e1e1e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.logo{position:absolute;left:26px;top:27px;height:36px;display:flex;align-items:center;gap:8px;user-select:none}
.logo i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fff,#bdbdb8 60%,#8d8d88);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.logo span{font:italic 400 28px/1 "Sorts Mill Goudy",Newsreader,Georgia,serif;letter-spacing:-1px;color:#7a7a77}
.modetag{position:absolute;left:0;right:0;top:526px;text-align:center;font-size:11.5px;color:#8b8b8b;pointer-events:none;transition:opacity .3s}
.minicam{position:absolute;left:306px;top:24.5px;width:74px;height:38px;border-radius:4px;filter:drop-shadow(0 2.5px 2.5px rgba(0,0,0,.3)) drop-shadow(0 5px 6px rgba(0,0,0,.12))}
.minicam svg{display:block;width:100%;height:100%}
.pop{position:absolute;left:18px;top:70px;z-index:20;background:rgba(245,245,245,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(5,36px);gap:8px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);transform-origin:20px 0;transition:opacity .2s,transform .2s}
.pop.off{opacity:0;transform:scale(.9);pointer-events:none}
.pop button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pop .grad{background-size:cover;background-position:center}
.pop button[aria-pressed=true]{outline:2px solid #111;outline-offset:2px}
.pop .orig{background:conic-gradient(#d8c9b5 0 25%,#7a8f63 0 50%,#c98a6a 0 75%,#8aa3b8 0)}
.pop p{grid-column:1/-1;margin:2px 2px 0;font-size:11.5px;color:var(--muted)}

/* carousel */
.roll{position:absolute;left:0;right:0;top:92px;height:462px;perspective:900px;perspective-origin:50% 50%;transform-style:preserve-3d;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.it{position:absolute;transition:transform .5s cubic-bezier(.2,.8,.2,1),left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1),opacity .4s,border-radius .45s;cursor:pointer;backface-visibility:hidden}
.it:not(.center) .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 60%)}
.it .ph{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background-color:#bdbdbb;background-repeat:no-repeat;background-position:0 0;background-size:332px 442px;transition:opacity .35s}
.it.tile .ph{background-repeat:repeat;background-size:112px 112px;background-position:center}
.it.tile.glassy .ph{background-size:256px 256px}
.grid .g.tile.glassy{background-size:150px}
.it.card .ph{box-shadow:0 10px 18px -6px rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.2)}
.it .obj{position:absolute;inset:0;opacity:0;transition:opacity .35s}
.it.as-obj .ph{opacity:0}
.it.as-obj .obj{opacity:1}
.it.as-obj.center{filter:drop-shadow(0 18px 16px rgba(0,0,0,.15)) drop-shadow(0 5px 6px rgba(0,0,0,.25))}
.it .obj svg{width:100%;height:100%;display:block;overflow:visible}
.osd{position:absolute;inset:14px 16px;font:19px/1 VT323,ui-monospace,monospace;color:rgba(255,255,255,.82);text-shadow:0 0 6px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .3s .1s}
.it.center:not(.as-obj) .osd{opacity:1}
.osd span{position:absolute}
.shimmer{background:linear-gradient(100deg,#c4c4c2 30%,#d8d8d6 50%,#c4c4c2 70%) 0 0/300% 100% !important;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-300% 0}}

/* grid */
.grid{position:absolute;left:0;right:0;top:84px;bottom:88px;overflow:auto;padding:12px 22px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;align-content:start}
.grid button{text-align:left}
.grid .g{aspect-ratio:3/4;border-radius:16px;background-size:cover;background-position:center;background-color:#c4c4c2;box-shadow:0 4px 8px -2px rgba(0,0,0,.2)}
.grid .g.tile{background-size:64px;background-position:center}
.grid .n{font:15px/1.2 Newsreader,Georgia,serif;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid .d{font-size:11.5px;color:var(--muted)}

/* info */
.info{position:absolute;left:36.4px;top:566px;width:326px;padding:4px;display:flex;justify-content:space-between;align-items:flex-start;transition:opacity .25s}
.info h2{margin:0;font:400 20px/normal Newsreader,Georgia,serif;letter-spacing:-.005em;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{margin-top:14px;font-size:12px;line-height:16px;color:var(--muted)}
.acts{display:flex;gap:6px;flex:none}
.dl{width:31.7px;height:31px;border-radius:6px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.dl .ic{width:16px;height:16px;stroke-width:1.7}
.dl.busy{opacity:.5;cursor:progress}
.hint{position:absolute;left:40px;right:40px;top:700px;text-align:center;font-size:12px;color:#8b8b8b}

/* bottom nav */
.nav{position:absolute;left:calc(50% - 1.56px);transform:translateX(-50%);top:819.5px;display:flex;gap:4px;padding:8px;border-radius:100px;background:var(--glass);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.nav button{width:48px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.nav button[aria-pressed=true],.nav button[aria-expanded=true]{background:var(--chip)}
.nav .sw{width:22px;height:22px;border-radius:50%;background:conic-gradient(#d8c9b5 0 25%,#7a8f63 0 50%,#c98a6a 0 75%,#8aa3b8 0);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.6)}
.pop.low{top:auto;bottom:84px;left:50%;margin-left:-118px;transform-origin:50% 100%}

/* camera — Y2K silver compact: brushed aluminium, raised screen frame, chrome keys + dial, tiny printed blue/red icons */
#camera{transition:none}
#camera.off{transform:none}
.body{position:absolute;left:2.3px;top:0;width:397px;height:773px;border-radius:30px;overflow:hidden;transform-origin:50% 50%;
  background:var(--m-body) center/100% 100% no-repeat,#c9c9c6;
  box-shadow:0 6px 10px 4px rgba(0,0,0,.14),0 2px 3px rgba(0,0,0,.3)}
.body::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2.5px;z-index:3;background:linear-gradient(145deg,#fff 0%,rgba(255,255,255,.95) 10%,rgba(255,255,255,.2) 32%,rgba(255,255,255,0) 50%,rgba(0,0,0,.08) 68%,rgba(0,0,0,.4) 92%,rgba(0,0,0,.55) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.body::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:14px;z-index:2;background:linear-gradient(145deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.25) 20%,rgba(255,255,255,0) 42%,rgba(0,0,0,0) 60%,rgba(0,0,0,.12) 82%,rgba(0,0,0,.26) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none;filter:blur(1px)}
.body .grain{display:none}
.frame{position:absolute;left:16px;top:16px;width:365px;height:488px;border-radius:20px;
  background:var(--m-frame) center/100% 100% no-repeat,#d6d6d3;
  box-shadow:0 1px 0 rgba(0,0,0,.2),0 3px 4px rgba(0,0,0,.24),0 8px 14px rgba(0,0,0,.1)}
.frame::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(150deg,#fff 0%,#fff 14%,rgba(255,255,255,.1) 40%,rgba(0,0,0,.05) 60%,rgba(0,0,0,.35) 90%,rgba(0,0,0,.45) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:9px;background:linear-gradient(150deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 35%,rgba(0,0,0,0) 62%,rgba(0,0,0,.14) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.bezel{position:absolute;left:14px;top:14px;width:337px;height:420px;border-radius:7px;background:#0d0d0d;box-shadow:inset 0 0 0 2px #2a2a2a,0 0 0 2px #9d9d99,0 0 0 3px rgba(255,255,255,.8)}
.lcd{position:absolute;left:8px;top:8px;right:8px;bottom:8px;border-radius:3px;overflow:hidden;background:#121412}
.lcd video,.lcd .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center}
.lcd .still{filter:saturate(.9) contrast(.96)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(128deg,rgba(255,255,255,.16),transparent 32%),repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px)}
.lcd .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.lcd .flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.lcd .ro{position:absolute;inset:12px 14px;font:22px/1 VT323,ui-monospace,monospace;color:rgba(255,255,255,.92);text-shadow:0 0 6px rgba(0,0,0,.6);pointer-events:none;z-index:2}
.lcd .ro span{position:absolute}
.focus{position:absolute;left:50%;top:50%;width:84px;height:64px;transform:translate(-50%,-50%);pointer-events:none;z-index:2;
  background:linear-gradient(#fff,#fff) 0 0/14px 2px,linear-gradient(#fff,#fff) 0 0/2px 14px,linear-gradient(#fff,#fff) 100% 0/14px 2px,linear-gradient(#fff,#fff) 100% 0/2px 14px,linear-gradient(#fff,#fff) 0 100%/14px 2px,linear-gradient(#fff,#fff) 0 100%/2px 14px,linear-gradient(#fff,#fff) 100% 100%/14px 2px,linear-gradient(#fff,#fff) 100% 100%/2px 14px;background-repeat:no-repeat;opacity:.85}
.lcd .msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:24px/1.15 VT323,monospace;color:#cfe3c9;padding:0 30px;z-index:2}
.lcd .startbtn{position:absolute;inset:0;z-index:3}
.brand{position:absolute;left:0;right:0;top:446px;text-align:center;font:700 25px/1 Newsreader,Georgia,serif;letter-spacing:.01em;color:#5d5d5a;text-shadow:0 1px 0 rgba(255,255,255,.85),0 -1px 0 rgba(0,0,0,.18)}
.model{position:absolute;right:22px;top:456px;font:600 9px/1 Geist,sans-serif;letter-spacing:.14em;color:#7c7c78}
.led{position:absolute;left:22px;top:456px;display:flex;align-items:center;gap:5px;font:600 9px/1 Geist,sans-serif;letter-spacing:.14em;color:#7c7c78}
.led i{width:6px;height:6px;border-radius:50%;background:#8e8e8a;box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.led.on i{background:#64d14a;box-shadow:0 0 5px #8ff26f}
.prt{position:absolute;font:600 9.5px/1 Geist,sans-serif;letter-spacing:.12em;color:#585855;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.prt.red{color:#585855}
.prt svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.key{position:absolute;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:translateY(-8px);
  background:var(--m-dome) center/100% 100% no-repeat,#cfcfcc;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 2px 1px #fff,inset 0 -2px 3px rgba(0,0,0,.14),0 1px 0 #b4b4af,0 2px 0 #aaaaa5,0 3px 0 #a0a09b,0 4px 0 #979792,0 5px 0 #8e8e89,0 6px 0 #868681,0 7px 0 #7e7e79,0 8px 0 #74746f,2px 12px 8px rgba(0,0,0,.4),4px 16px 16px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.key::before{display:none}
.key:active,.key.press{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 2px 3px rgba(0,0,0,.12),0 1px 0 #b4b4af,0 2px 0 #979792,0 3px 0 #74746f,1px 5px 4px rgba(0,0,0,.4)}
.key svg{position:relative;width:18px;height:18px;fill:none;stroke:#55554f;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dialring{position:absolute;left:180px;top:565px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,#232322 0 31%,rgba(0,0,0,.3) 31.5%,rgba(255,255,255,.35) 33%,transparent 34.5%),var(--m-spun) center/100% 100% no-repeat;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.15),0 1px 0 #a3a39e,0 2px 0 #999994,0 3px 0 #8f8f8a,0 4px 0 #858580,0 5px 1px #77776f,2px 10px 10px rgba(0,0,0,.32)}
.dialring::before{display:none}
.dialring .tick{position:absolute;width:5px;height:5px;border-radius:50%;background:#55554f;box-shadow:0 1px 0 rgba(255,255,255,.7)}
.key.big{left:39px !important;top:39px !important;width:72px;height:72px;font:600 9px/1 Geist,sans-serif;letter-spacing:.12em;color:#3d3d3a;text-shadow:0 1px 0 rgba(255,255,255,.6);transform:translateY(-9px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset 0 2px 1px #fff,inset 0 -3px 5px rgba(0,0,0,.18),0 1px 0 #b4b4af,0 2px 0 #aaaaa5,0 3px 0 #a0a09b,0 4px 0 #979792,0 5px 0 #8e8e89,0 6px 0 #868681,0 7px 0 #7e7e79,0 8px 0 #74746f,0 9px 0 #6c6c67,2px 14px 10px rgba(0,0,0,.42),5px 20px 18px rgba(0,0,0,.18)}
.key.big:active,.key.big.press{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset 0 2px 4px rgba(0,0,0,.16),0 1px 0 #b4b4af,0 2px 0 #979792,0 3px 0 #74746f,1px 5px 4px rgba(0,0,0,.4)}
.key.big span{position:relative}
.slide{position:absolute;left:77px;top:631px;width:76px;height:22px;border-radius:11px;background:linear-gradient(180deg,#7d7d79,#b4b4b0);box-shadow:inset 0 2px 3px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.85)}
.slide .knob{position:absolute;left:2px;top:-3px;width:42px;height:22px;border-radius:9px;transition:transform .18s cubic-bezier(.3,.7,.2,1);
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1px,rgba(255,255,255,.25) 1px 2px,transparent 2px 4px),var(--m-knob) center/100% 100%;box-shadow:inset 0 1px 0 #fff,0 1px 0 #a5a5a0,0 2px 0 #97978f,0 3px 0 #87877f,0 4px 1px #75756d,1px 7px 6px rgba(0,0,0,.38)}
.slide.front .knob{transform:translateX(30px)}
.vf{position:absolute;left:300px;top:522px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#5b5f63,#14161a 58%,#050607);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 4px #ececea,0 0 0 5px #b2b2ad,0 0 0 7px #d9d9d6,0 1px 0 7px #fff,0 3px 0 7px #9b9b96,0 6px 8px 7px rgba(0,0,0,.25)}
.vf::after{content:"";position:absolute;left:11px;top:9px;width:12px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(-25deg)}
.dots{position:absolute;left:322px;top:690px;width:44px;height:44px}
.dots i{position:absolute;width:5px;height:5px;border-radius:50%;background:#3d3d3a;box-shadow:inset 0 1px 1px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.8)}
.sock{position:absolute;width:66px;height:66px;border-radius:50%;background:var(--m-spun) center/100% 100% no-repeat;box-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 1px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.14)}
.sock::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#2e2e2c;box-shadow:inset 0 2px 3px rgba(0,0,0,.75)}
.sock .key{left:8px;top:8px}
.lbl{position:absolute;font:600 9.5px/1 Geist,sans-serif;letter-spacing:.14em;color:#6c6c67;text-align:right;width:56px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.strip{position:absolute;left:0;right:0;top:806px;height:67px;display:flex;align-items:center;gap:4px;padding:0 177px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;perspective:340px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent)}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:48px;height:63px;border-radius:3px;background-size:cover;background-position:center;background-color:#bdbdbb;scroll-snap-align:center;transform-style:preserve-3d;will-change:transform;box-shadow:0 2px 4px rgba(0,0,0,.18)}
.strip button.cur{box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.25)}
.strip .none{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;margin:0 -60px}
.back{position:absolute;left:18px;top:828px;height:28px;padding:0 10px 0 6px;border-radius:999px;display:flex;align-items:center;gap:2px;font-size:12px;color:#555;background:var(--glass)}
.back svg{width:16px;height:16px;fill:none;stroke:#555;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#1d1d1d;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto;display:flex;gap:12px;align-items:center}
.toast button{color:#9fc0ff;font-weight:500}
.empty{position:absolute;left:40px;right:40px;top:250px;text-align:center;font:20px/1.3 Newsreader,Georgia,serif;color:#555}
.empty small{display:block;font:13px Geist,sans-serif;color:var(--muted);margin-top:8px}
@media(prefers-reduced-motion:reduce){.it,.screen,.toast{transition:none}.shimmer{animation:none}}
</style>
</head>
<body>
<div id="frame"><div id="app">

  <!-- ============ GALLERY ============ -->
  <section class="screen" id="gallery" aria-label="Texture roll">
    <div class="logo" aria-label="textura"><span>textura</span></div>
    <button class="minicam" id="miniCam" aria-label="Open camera"></button>
    <div class="pop off low" id="pop" role="group" aria-label="Tint"></div>

    <div class="roll" id="roll"></div>
    <div class="grid" id="grid" hidden></div>

    <div class="info" id="info">
      <div>

roll.addEventListener('click', e => { const el = e.target.closest('.it'); if (!el || drag.moved) return; const i = +el.dataset.i; if (i !== idx) go(i); else cycleMode(); });
const drag = { x: 0, on: false, moved: false };
roll.addEventListener('pointerdown', e => { drag.on = true; drag.x = e.clientX; drag.moved = false; });
roll.addEventListener('pointermove', e => { if (drag.on && Math.abs(e.clientX - drag.x) > 8) drag.moved = true; });
roll.addEventListener('pointerup', e => { if (!drag.on) return; drag.on = false; const dx = (e.clientX - drag.x) / scale; if (Math.abs(dx) > 36) go(idx + (dx < 0 ? 1 : -1)); setTimeout(() => drag.moved = false, 0); });
roll.addEventListener('pointercancel', () => drag.on = false);
let wheelLock = 0;
roll.addEventListener('wheel', e => { const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0; if (Math.abs(d) < 12 || Date.now() < wheelLock) return; wheelLock = Date.now() + 380; go(idx + (d > 0 ? 1 : -1)); }, { passive: true });
document.addEventListener('keydown', e => {
  if (!$('camera').classList.contains('off')) { if (e.key === 'Escape') showScreen('gallery'); if (e.key === ' ' || e.key === 'Enter') { if (e.target === document.body) { e.preventDefault(); snap(); } } return; }
  if (e.key === 'Enter' && e.target === document.body) cycleMode(); if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1); if (e.key === 'Escape') closePop();
});

/* ================= modes, tint, grid, nav ================= */
const MODES = ['image', 'folder', 'envelope'], MODE_NAME = { image: 'image', folder: 'folder', envelope: 'envelope' };
function cycleMode() { mode = MODES[(MODES.indexOf(mode) + 1) % 3]; layout(true); showModeTag(); }
function showModeTag() { const next = MODES[(MODES.indexOf(mode) + 1) % 3]; $('modetag').textContent = `Showing as ${MODE_NAME[mode]} · tap for ${MODE_NAME[next]}`; }
const pop = $('pop');
pop.innerHTML = TINTS.map(h => h ? `<button data-t="${h}" style="background:${h}" aria-label="Tint ${h}" aria-pressed="false"></button>` : `<button class="orig" data-t="" aria-label="Original colours" aria-pressed="true"></button>`).join('')
  + Object.entries(GRADS).map(([k, g]) => `<button data-t="g:${k}" class="grad" style="background-image:url(${swatchUrl(k)})" aria-label="${g.name} gradient" aria-pressed="false"></button>`).join('')
  + '<p>Solid colours, then mesh gradients</p>';
for (const x of pop.querySelectorAll('button')) x.setAttribute('aria-pressed', (x.dataset.t || null) === tint);
$('navSw').style.background = isGrad(tint) ? `center/cover url(${swatchUrl(tint.slice(2))})` : (tint || '');
const closePop = () => { pop.classList.add('off'); $('navColour').setAttribute('aria-expanded', 'false'); };
$('navColour').addEventListener('click', e => { e.stopPropagation(); const wasOpen = !pop.classList.contains('off') && pop.classList.contains('low'); closePop(); if (wasOpen) return; pop.classList.add('low'); pop.classList.remove('off'); $('navColour').setAttribute('aria-expanded', 'true'); });
document.addEventListener('click', e => { if (!pop.contains(e.target) && !$('navColour').contains(e.target)) closePop(); });
pop.addEventListener('click', async e => { const b = e.target.closest('button'); if (!b) return; tint = b.dataset.t || null;
  for (const x of pop.querySelectorAll('button')) x.setAttribute('aria-pressed', x === b);
  $('navSw').style.background = isGrad(tint) ? `center/cover url(${swatchUrl(tint.slice(2))})` : (tint || ''); closePop(); layout(true); if (view === 'grid') buildGrid(); ensureTex(); });
function buildGrid() {
  $('grid').innerHTML = items.map((it, i) => { const { url: u, tiled } = texOf(it); return `<button data-i="${i}" aria-label="${esc(it.name)}"><div class="g${tiled ? ' tile' : ''}${it.kind === 'glass' ? ' glassy' : ''}${u ? '' : ' shimmer'}" style="${u ? `background-image:url(${u})` : ''}"></div><div class="n">${esc(it.name)}</div><div class="d">${esc(fmtDate(it.date))}</div></button>`; }).join('');
}
$('grid').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; idx = +b.dataset.i; setView('roll'); layout(); ensureTex(); });
function setView(v) {
  view = v; $('grid').hidden = v !== 'grid'; roll.hidden = v === 'grid'; $('info').style.opacity = v === 'grid' ? 0 : 1; $('info').style.pointerEvents = v === 'grid' ? 'none' : ''; $('hint').hidden = v === 'grid'; $('modetag').hidden = v === 'grid';
  $('navRoll').setAttribute('aria-pressed', v === 'roll'); $('navGrid').setAttribute('aria-pressed', v === 'grid'); if (v === 'grid') buildGrid();
}
$('navRoll').addEventListener('click', () => setView('roll'));
$('navGrid').addEventListener('click', () => setView('grid'));
$('navPlus').addEventListener('click', () => showScreen('camera'));
$('miniCam').addEventListener('click', () => showScreen('camera'));

/* ================= camera ================= */
let stream = null, facing = 'environment';
const video = $('video');
// the big camera body shrinks, turns and lands on the mini camera in the top bar (and back)
const MINI_T = () => { const r = 38 / 397; return `translate(${306 + 37 - (2.3 + 397 / 2)}px, ${24.5 + 19 - 773 / 2}px) rotate(-90deg) scale(${r})`; };
let morphing = false;
function showScreen(s) {
  const cam = $('camera'), gal = $('gallery'), body = $('camBody'), mini = $('miniCam'), stripEl = $('strip');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, opts = { duration: reduce ? 1 : 620, easing: 'cubic-bezier(.65,0,.25,1)', fill: 'both' };
  if (morphing) return; const opening = s === 'camera';
  if (opening === !cam.classList.contains('off')) return;
  morphing = true;
  if (opening) {
    buildStrip(); tick(); cam.classList.remove('off'); mini.style.visibility = 'hidden';
    gal.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 1 : 260, fill: 'both' }).onfinish = () => gal.classList.add('off');
    stripEl.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { ...opts, delay: reduce ? 0 : 300, duration: reduce ? 1 : 360 });
    const a = body.animate([{ transform: MINI_T(), borderRadius: '36px' }, { transform: 'none', borderRadius: '30px' }], opts);
    a.onfinish = () => { a.cancel(); morphing = false; if (!stream) startCam(); };
  } else {
    stopCam(); setView('roll'); layout(); gal.classList.remove('off');
    gal.getAnimations().forEach(x => x.cancel());
    gal.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduce ? 1 : 420, delay: reduce ? 0 : 160, fill: 'backwards' });
    stripEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 1 : 200, fill: 'forwards' });
    const a = body.animate([{ transform: 'none', borderRadius: '30px' }, { transform: MINI_T(), borderRadius: '36px' }], opts);
    a.onfinish = () => { cam.classList.add('off'); mini.style.visibility = ''; a.cancel(); stripEl.getAnimations().forEach(x => x.cancel()); morphing = false; };
  }
}
function lcdMsg(t) { $('lcdMsg').textContent = t; $('lcdMsg').hidden = !t; $('startBtn').hidden = !t || !/Tap/.test(t); }
async function startCam() {
  if (!navigator.mediaDevices?.getUserMedia) { lcdMsg('No camera here. Press LOAD to pick a photo.'); return; }
  lcdMsg('Warming up…');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1440 }, height: { ideal: 1920 } }, audio: false });
    video.srcObject = stream; video.hidden = false; $('led').classList.add('on'); $('focus').hidden = false; $('still').style.opacity = 0; await video.play().catch(() => {}); lcdMsg('');
  } catch (e) { stream = null; lcdMsg(e?.name === 'NotAllowedError' ? 'Camera blocked. Allow it, or press LOAD to pick a photo.' : 'No camera here. Press LOAD to pick a photo.'); }
}
function stopCam() { $('led').classList.remove('on'); if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } video.hidden = true; $('focus').hidden = true; $('still').style.opacity = 1; }
$('startBtn').addEventListener('click', startCam);
$('flipBtn').addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; $('flipBtn').classList.toggle('front', facing === 'user'); stopCam(); startCam(); });
$('rollBtn').addEventListener('click', () => showScreen('gallery'));
$('loadBtn').addEventListener('click', () => $('file').click());
$('shutter').addEventListener('click', snap);
function tick() {
  const d = new Date();
  $('roDate').textContent = "'" + String(d.getFullYear()).slice(2) + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
  $('roTime').textContent = d.toTimeString().slice(0, 5);
  $('roCount').textContent = String(items.filter(x => !x.sample).length).padStart(2, '0') + '/99';
}
setInterval(() => { if (!$('camera').classList.contains('off')) tick(); }, 15000);
function where() {
  return new Promise(res => { if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res(dms(p.coords.latitude, 'N', 'S') + ', ' + dms(p.coords.longitude, 'E', 'W')), () => res(null), { timeout: 5000, maximumAge: 120000 }); });
}
function frameToUrl(src, sw, sh) {
  const c = document.createElement('canvas'); c.width = PW * 1.5; c.height = PH * 1.5; const ar = c.width / c.height;
  let w = sw, h = sw / ar; if (h > sh) { h = sh; w = sh * ar; }
  c.getContext('2d').drawImage(src, (sw - w) / 2, (sh - h) / 2, w, h, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .85);
}
let capN = 0;
async function addCapture(url) {
  const it = { id: 'c' + Date.now().toString(36), name: `texture-${String(items.filter(x => !x.sample).length + 1).padStart(2, '0')}.png`, date: Date.now(), coords: null, sample: false, url };
  items.unshift(it); idx = 0; $('still').style.backgroundImage = `url(${url})`; buildRoll(); buildStrip(); tick(); persist(); ensureTex();
  it.coords = await where(); persist(); if (!$('gallery').classList.contains('off')) showInfo();
  return it;
}
async function snap() {
  const sh = $('shutter'); sh.classList.add('press'); setTimeout(() => sh.classList.remove('press'), 120);
  if (!stream || !video.videoWidth) { $('file').click(); return; }
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  await addCapture(frameToUrl(video, video.videoWidth, video.videoHeight)); toast('Captured. Press ROLL to see it.');
}
$('file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file || !file.type.startsWith('image/')) return;
  try { const img = await loadImg(URL.createObjectURL(file)); const it = await addCapture(frameToUrl(img, img.naturalWidth, img.naturalHeight));
    it.name = (file.name.replace(/\.[^.]+$/, '').slice(0, 24) || 'photo') + '.png'; persist(); buildRoll(); showScreen('gallery'); }
  catch { toast('Couldn’t read that image.'); }
});
const strip = $('strip');
function buildStrip() {
  strip.innerHTML = items.length ? items.map((it, i) => `<button data-i="${i}" class="${i === idx ? 'cur' : ''}" style="${it.url ? `background-image:url(${it.url})` : ''}" aria-label="${esc(it.name)}"></button>`).join('')
    : '<span class="none">Your captures will line up here</span>';
  const b = strip.children[idx]; if (b && b.dataset.i) strip.scrollLeft = b.offsetLeft + 24 - strip.clientWidth / 2;
  slant(); setStill();
}
function setStill() { const cur = items[idx]; $('still').style.backgroundImage = cur?.url ? `url(${cur.url})` : ''; }
// cover-flow: the centred frame faces you, frames to the sides turn away and crowd in
function slant() {
  const mid = strip.scrollLeft + strip.clientWidth / 2; let best = -1, bd = 1e9;
  for (const b of strip.querySelectorAll('button')) {
    const d = (b.offsetLeft + 24 - mid) / 52, a = Math.abs(d), sgn = Math.sign(d);
    const turn = Math.min(a, 1) * 58, pull = Math.max(0, a - .6) * 14, depth = Math.min(a, 2) * 6;
    b.style.transformOrigin = sgn > 0 ? '0% 50%' : sgn < 0 ? '100% 50%' : '50% 50%';
    b.style.transform = `translateX(${-sgn * pull}px) translateZ(${-depth}px) rotateY(${sgn * turn}deg)`;
    b.style.opacity = a < .5 ? 1 : Math.max(.35, 1 - a * .16); b.style.zIndex = String(100 - Math.round(a * 10));
    if (a < bd) { bd = a; best = +b.dataset.i; }
  }
  return best;
}
let stripRaf = 0, stripEnd = 0;
strip.addEventListener('scroll', () => {
  if (!stripRaf) stripRaf = requestAnimationFrame(() => { stripRaf = 0; slant(); });
  clearTimeout(stripEnd); stripEnd = setTimeout(() => { const c = slant(); if (c >= 0 && c !== idx) { idx = c; for (const b of strip.children) b.classList.toggle('cur', +b.dataset.i === idx); setStill(); } }, 110);
}, { passive: true });
strip.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i;
  if (i === idx) { showScreen('gallery'); return; }
  strip.scrollTo({ left: b.offsetLeft + 24 - strip.clientWidth / 2, behavior: 'smooth' });
});

/* ================= delete with undo ================= */
$('del').addEventListener('click', () => {
  const it = items[idx]; if (!it) return;
  const at = idx; items.splice(at, 1); if (it.sample) gone.push(it.id);
  idx = Math.min(idx, Math.max(0, items.length - 1)); persist(); buildRoll(); if (view === 'grid') buildGrid();
  toast(`Deleted ${it.name}`, 'Undo', () => {
    items.splice(at, 0, it); gone = gone.filter(g => g !== it.id); idx = at; persist(); buildRoll(); if (view === 'grid') buildGrid(); ensureTex();
  });
});

/* ================= download: texture pack .zip ================= */
let dlCap = null; window.claude?.use?.('downloads').then(d => { dlCap = d; }).catch(() => {});
const blobOf = (cv, type = 'image/png', q) => new Promise(r => cv.toBlob(r, type, q));
async function save(filename, blob) {
  if (dlCap) { try { await dlCap.save({ filename, data: blob }); toast('Saved ' + filename); } catch (e) { toast(e?.code === 'declined' ? 'Download cancelled.' : 'Downloads aren’t available in this view.'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = -1; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; };
function zip(files) {
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  for (const f of files) { const nm = enc.encode(f.name), data = f.data, crc = crc32(data), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nm); off += 30 + nm.length + data.length; }
  const cs = cen.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cs, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], { type: 'application/zip' });
}
const bytes = async b => new Uint8Array(await b.arrayBuffer());
$('dl').addEventListener('click', async () => {
  const it = items[idx], btn = $('dl'); if (!it?.url || btn.classList.contains('busy')) return;
  btn.classList.add('busy');
  try {
    const ex = await extracted(it), base = it.name.replace(/\.[^.]+$/, ''), colour = tint ? finish(it, baseFor(tint), ex.height, isGrad(tint) ? .2 : .32, 3) : finish(it, ex.albedo, ex.height, .3, 3);
    const meta = { name: it.name, captured: new Date(it.date).toISOString(), location: it.coords, tint: tint || 'original', size: S, tileable: !isGrad(tint) };
    const readme = `# ${base}\n\nTexture pack from Texture Lab. ${S}×${S}px, tiles seamlessly.\n\n- ${base}-height.png: grey relief, 50% grey = flat. Use it to recolour.\n- ${base}-normal.png: normal map (OpenGL, green up) for 3D tools.\n- ${base}-colour.png: the ${tint ? 'tinted' : 'evenly lit'} colour version.\n- ${base}-source.jpg: the photo it came from.\n\n## Figma\nRectangle with your colour fill, then add an Image fill with ${base}-height.png, set to Tile, blend mode Soft light or Overlay.\n\n## CSS\n\`\`\`css\n.surface {\n  background: url("${base}-height.png") 0 0 / 256px, ${tint || '#879c66'};\n  background-blend-mode: soft-light;\n}\n\`\`\`\n`;
    const src = await (await fetch(it.url)).blob();
    const files = [
      { name: `${base}-height.png`, data: await bytes(await blobOf(heightCanvas(ex.height))) },
      { name: `${base}-normal.png`, data: await bytes(await blobOf(normalCanvas(ex.height))) },
      { name: `${base}-colour.png`, data: await bytes(await blobOf(toCanvas(colour))) },
      { name: `${base}-source.jpg`, data: await bytes(src) },
      { name: 'texture.json', data: new TextEncoder().encode(JSON.stringify(meta, null, 2)) },
      { name: 'README.md', data: new TextEncoder().encode(readme) }];
    await save(`${base}-texture-pack.zip`, zip(files));
  } catch (e) { toast('Couldn’t build the pack.'); } finally { btn.classList.remove('busy'); }
});

/* ================= fit the phone screen ================= */
let scale = 1;
function fit() {
  const W = innerWidth, H = innerHeight, phone = W < 560;
  document.body.classList.toggle('phone', phone);
  scale = phone ? Math.min(W / 402, H / 891) : Math.min(1, (H - 48) / 891, (W - 48) / 402);
  const app = $('app'), fr = $('frame'); app.style.transform = `scale(${scale})`; fr.style.width = 402 * scale + 'px'; fr.style.height = 891 * scale + 'px';
}
addEventListener('resize', fit); fit();

/* ================= boot ================= */
buildRoll();
(function gen() {
  const it = items.find(x => x.sample && !x.url); if (!it) return;
  const H = SAMPLES[it.si][1](), A = new Uint8ClampedArray(S * S * 4);
  for (let k = 0; k < S * S; k++) { const g = 208 + (H[k] - .5) * 44; A[k * 4] = g; A[k * 4 + 1] = g - 1; A[k * 4 + 2] = g - 3; A[k * 4 + 3] = 255; }   // neutral: colour comes from the background
  const c = cache.get(it.id) || {}; cache.set(it.id, c); c.ex = { height: H, albedo: A };
  it.url = toCanvas(finish(it, A, H, .24, 3)).toDataURL('image/jpeg', .9); layout(true); if (view === 'grid') buildGrid(); ensureTex();
  setTimeout(gen, 30);
})();
ensureTex(); showModeTag();
}
